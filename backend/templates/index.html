<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Multi RTSP Viewer (YOLOv5 ONNX)</title>
    <script src="https://cdn.socket.io/4.6.1/socket.io.min.js"></script>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        margin: 12px;
      }
      .stream {
        display: inline-block;
        margin: 10px;
        vertical-align: top;
      }
      img {
        display: block;
        max-width: 480px;
        border: 1px solid #ccc;
      }
      .meta {
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <h3>Streams</h3>
    <div id="streams"></div>

    <script>
      const socket = io();
      const containers = {};

      socket.on("frame", (payload) => {
        const id = payload.stream_id;
        if (!containers[id]) {
          const div = document.createElement("div");
          div.className = "stream";
          const title = document.createElement("div");
          title.innerText = "Stream " + id;
          const img = document.createElement("img");
          img.alt = "stream " + id;
          const meta = document.createElement("div");
          meta.className = "meta";
          div.appendChild(title);
          div.appendChild(img);
          div.appendChild(meta);
          document.getElementById("streams").appendChild(div);
          containers[id] = { img, meta };
        }
        containers[id].img.src = "data:image/jpeg;base64," + payload.image;
        const dets = payload.detections
          .map((d) => `${d.label} (${(d.score * 100).toFixed(0)}%)`)
          .join(", ");
        containers[id].meta.innerText = `Detections: ${
          dets || "none"
        } — ${new Date(payload.timestamp * 1000).toLocaleTimeString()}`;
      });
    </script>
  </body>
</html>
